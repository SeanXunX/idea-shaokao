<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Research workspace · idea-shaokao</title>
<style>:root {
  --bg:#ffffff; --surface:#ffffff; --subtle:#f6f8fa; --text:#1f2328;
  --muted:#59636e; --line:#d1d9e0; --accent:#0969da; --green:#1a7f37;
  --body-font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono-font:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",monospace;
}
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 var(--body-font); -webkit-font-smoothing:antialiased }
button,input,select,textarea { font:inherit; color:inherit }
button,a { touch-action:manipulation }
button { cursor:pointer }
a { color:var(--accent); text-decoration:none }
a:hover { text-decoration:underline }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible { outline:2px solid var(--accent); outline-offset:3px }
h1,h2,h3,h4,p,ol,dl { margin:0 }
h1,h2,h3,h4 { line-height:1.4; font-weight:600 }
button,a,p,h1,h2,h3,dd,td,th { overflow-wrap:anywhere }
[hidden] { display:none!important }
.mono,code { font-family:var(--mono-font); font-size:12px }
.quiet,.section-caption,.page-description { color:var(--muted) }
.sr-only,.skip-link:not(:focus) { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap }
.skip-link:focus { position:fixed; top:10px; left:10px; z-index:100; padding:8px 16px; background:var(--bg); border:1px solid var(--accent) }
#main-content:focus { outline:none }
.workspace-header { min-height:60px; background:var(--subtle); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:24px; padding:12px 32px }
.workspace-brand { display:flex; gap:14px; align-items:center; min-width:0; font-size:14px }
.workspace-brand a { color:var(--text); font-weight:600; white-space:nowrap }
.header-divider { color:#8c959f }
#project-slug { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted) }
.header-tools { display:flex; gap:8px; flex-shrink:0 }
.workspace-shell { max-width:1312px; margin:0 auto; padding:0 40px }
.project-context { display:flex; justify-content:space-between; align-items:center; gap:24px; padding:25px 0 17px }
.project-label { display:flex; align-items:center; gap:12px; font-weight:600; font-size:15px }
.project-label .badge { color:var(--muted); font-weight:400 }
.project-meta { display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; color:var(--muted); font-size:12px }
.section-nav { display:flex; gap:24px; border-bottom:1px solid var(--line); min-height:45px }
.section-link { display:flex; align-items:center; gap:8px; position:relative; color:var(--muted); padding:9px 0 12px; white-space:nowrap }
.section-link:hover { color:var(--text); text-decoration:none }
.section-link[aria-current="page"] { color:var(--text); font-weight:600 }
.section-link[aria-current="page"]::after { content:""; height:2px; background:var(--accent); position:absolute; bottom:-1px; left:0; right:0 }
.secondary-start { margin-left:auto }
.count { background:#eaeef2; border-radius:16px; padding:0 6px; font-size:12px; line-height:20px; font-weight:500 }
.main { padding:30px 0 56px; min-height:70vh; min-width:0 }
.page-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin-bottom:24px }
.page-heading h1 { font-size:26px; letter-spacing:-.45px; line-height:1.35; margin-bottom:6px }
.page-description { max-width:870px; font-size:14px; line-height:1.6 }
.page-heading>.ui-button { flex-shrink:0; margin-top:3px }
.ui-button,.btn { appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; max-width:100%; min-height:32px; padding:5px 12px; border:1px solid var(--line); border-radius:6px; background:var(--subtle); font:500 13px/20px var(--body-font); color:var(--text); cursor:pointer; text-decoration:none }
.ui-button:hover,.btn:hover { background:#eef1f4; border-color:#b7c0ca; text-decoration:none }
.ui-button [aria-hidden="true"] { display:none }
.ui-button [data-note-count] { border-radius:12px; background:#e4e9ee; padding:0 5px; font-size:12px; line-height:18px }
.btn-primary { background:var(--accent); border-color:#0962c9; color:#fff }
.btn-primary:hover { color:#fff; background:#055fcb; border-color:#055fcb }
.link-button { border:0; background:none; padding:0; color:var(--accent); font:inherit; text-align:left; cursor:pointer }
.link-button:hover { text-decoration:underline }
.badge { display:inline-flex; align-items:center; width:fit-content; border:1px solid var(--line); padding:1px 8px; border-radius:20px; font-size:12px; font-weight:500; line-height:20px }
.recommendation-kill { color:#a40e26; background:#ffebe9; border-color:#ffcecb }
.recommendation-proceed { color:#116329; background:#dafbe1; border-color:#aceebb }
.recommendation-revise { color:#6e5200; background:#fff8c5; border-color:#e6cf85 }
.recommendation-restart,.recommendation-undetermined { color:var(--muted); background:var(--subtle) }
.decision-strip { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 24px; background:var(--subtle); border:1px solid var(--line); border-radius:6px; padding:16px 20px; margin-bottom:30px }
.decision-strip>div { display:flex; align-items:center; gap:12px }
.decision-strip>p { grid-row:2; max-width:1020px; line-height:1.65 }
.decision-strip>.link-button { align-self:start; grid-column:2; grid-row:1; font-size:12px; margin-top:3px; white-space:nowrap }
.decision-strip .quiet { font-size:12px }
.overview-layout { display:grid; grid-template-columns:minmax(0,1fr) 284px; gap:40px }
.overview-main,.overview-aside { min-width:0 }
.overview-section+.overview-section { margin-top:32px }
.section-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:16px }
.section-heading h2 { font-size:18px; letter-spacing:-.2px }
.section-heading>.text-link,.section-heading>.quiet { font-size:12px; flex-shrink:0 }
.idea-summary { font-size:15px; line-height:1.8 }
.method-summary { margin:20px 0; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line) }
.method-summary h3 { font-size:14px; margin-bottom:7px }
.method-summary p { line-height:1.75 }
.record-links { display:flex; align-items:center; flex-wrap:wrap; gap:4px 8px; font-size:12px; color:var(--muted); margin-top:10px }
.record-links .link-button { max-width:100% }
.claim-list { margin-top:22px }
.claim-row { display:grid; grid-template-columns:60px minmax(0,1fr); gap:12px; padding:15px 0; border-bottom:1px solid #e5e9ed }
.claim-row:first-child { border-top:1px solid #e5e9ed }
.record-id { color:var(--muted); font:12px/1.6 var(--mono-font); padding-top:2px; overflow-wrap:anywhere }
.claim-row h3 { font-size:14px; margin-bottom:3px }
.claim-row p { color:var(--muted); line-height:1.7 }
.claim-meta { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-top:8px }
.claim-meta .record-links { margin:0 }
.evidence-state { font-size:12px; font-weight:500 }
.claim-meta .ui-button { border:0; background:none; color:var(--accent); box-shadow:none; padding:0; min-height:24px; font-size:12px; font-weight:400 }
.round-summary-list { border:1px solid var(--line); border-radius:6px; overflow:hidden }
.round-summary { display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:14px; padding:18px; color:var(--text); border-bottom:1px solid var(--line) }
.round-summary:last-child { border:0 }
.round-summary:hover { background:var(--subtle); text-decoration:none }
.round-number { color:var(--muted); font:12px/1.7 var(--mono-font); padding-top:1px }
.round-summary-heading { display:flex; align-items:center; gap:12px; margin-bottom:6px }
.round-summary p { color:var(--muted); line-height:1.7; margin-bottom:8px }
.round-outcome { font-size:12px; line-height:1.7 }
.round-summary-end { color:var(--muted); font-size:12px; text-align:right; min-width:64px }
.round-summary-end>span { display:block; color:var(--accent); margin-top:8px }
.section-caption { font-size:12px; line-height:1.7; margin-top:12px }
.next-action { background:var(--subtle); padding:20px; border:1px solid var(--line); border-radius:6px }
.next-action h2,.record-context h2 { font-size:14px; margin-bottom:12px }
.next-action p { line-height:1.75; margin-bottom:18px }
.next-action .btn { width:100%; justify-content:space-between }
.record-context { margin-top:24px; padding-top:20px; border-top:1px solid var(--line) }
.record-context dl { display:grid; grid-template-columns:100px minmax(0,1fr); gap:10px 12px; margin-bottom:16px; font-size:12px }
dt { color:var(--muted) }
dd { margin:0; min-width:0 }
.record-context>.link-button { font-size:12px }
.record-context>a { display:flex; gap:14px; font:12px/1.7 var(--mono-font); padding:5px 0; color:var(--muted) }
.record-context>a span { font:14px/1.7 var(--body-font); color:var(--accent) }
.reading-layout { display:grid; grid-template-columns:190px minmax(0,1fr); gap:40px; align-items:start }
.reading-nav { position:sticky; top:24px; padding-right:20px; border-right:1px solid var(--line); font-size:13px }
.nav-caption { color:var(--muted); font-size:12px; font-weight:600; margin-bottom:12px }
.round-link,.plan-link { display:flex; gap:12px; color:var(--muted); border-radius:5px; padding:9px 10px; margin:0 0 4px -10px }
.round-link { flex-direction:column; gap:2px }
.plan-link>.mono { flex:0 0 16px; white-space:nowrap }
.round-link small { font:12px/1.5 var(--mono-font) }
.round-link:hover,.plan-link:hover { text-decoration:none; color:var(--text); background:var(--subtle) }
.round-link[aria-current="page"],.plan-link[aria-current="location"] { background:#ddf4ff; color:#0550ae; font-weight:600 }
.nav-help { border-top:1px solid var(--line); margin-top:20px; padding-top:16px; color:var(--muted); font-size:12px; line-height:1.8 }
.reading-content { min-width:0 }
.round-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:20px }
.round-heading h2 { font-size:22px; margin-bottom:6px }
.inline-meta { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; color:var(--muted); font-size:12px }
.round-snapshot { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:6px; overflow:hidden }
.round-snapshot>section { padding:20px; min-width:0 }
.round-snapshot>section+section { border-left:1px solid var(--line); background:var(--subtle) }
.round-snapshot h3 { font-size:14px; margin-bottom:10px }
.record-text { white-space:pre-line; line-height:1.8 }
.missing { color:var(--muted); line-height:1.8; padding:12px 0 }
.missing-inline { color:var(--muted); font-size:12px }
.reading-section { margin-top:30px }
.table-scroll { overflow-x:auto; border:1px solid var(--line); border-radius:6px }
.simple-table { width:100%; border-collapse:collapse; font-size:13px; text-align:left; table-layout:fixed }
.simple-table th { padding:10px 14px; color:var(--muted); background:var(--subtle); font-size:12px; font-weight:500; border-bottom:1px solid var(--line) }
.simple-table td { padding:14px; vertical-align:top; border-bottom:1px solid var(--line) }
.simple-table tr:last-child td { border-bottom:0 }
.review-table th:first-child { width:29% }
.review-table th:nth-child(2),.review-table th:nth-child(3) { width:16% }
.table-detail { display:block; color:var(--muted); font-size:12px; line-height:1.6; margin-top:4px }
.score-cell>.link-button { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums }
.phase-timeline { list-style:none; padding:0 }
.phase-timeline>li { position:relative; display:grid; grid-template-columns:32px minmax(0,1fr); gap:14px; padding:0 0 24px }
.phase-timeline>li:last-child { padding-bottom:0 }
.phase-timeline>li:not(:last-child)::before { content:""; position:absolute; left:15px; top:30px; bottom:0; width:1px; background:var(--line) }
.phase-number { height:30px; display:flex; align-items:center; justify-content:center; background:var(--subtle); border:1px solid var(--line); border-radius:50%; color:var(--muted); font:11px/1 var(--mono-font) }
.phase-heading { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding-top:3px }
.phase-heading h3 { font-size:14px }
.phase-heading .quiet { font-size:12px }
.phase-content p { margin:7px 0; line-height:1.75 }
.phase-content>.link-button { font-size:12px }
.concern-list { border-top:1px solid var(--line) }
.concern-item { padding:16px 0; border-bottom:1px solid var(--line) }
.concern-item>div { display:flex; align-items:baseline; flex-wrap:wrap; gap:10px }
.concern-item>p:not(.issue-subline) { margin:9px 0; line-height:1.75 }
.concern-item>.link-button { font-size:12px }
.issue-title { border:0; padding:0; background:none; text-align:left; font-weight:600; font-size:14px; line-height:1.6; color:var(--text) }
.issue-title:hover { color:var(--accent) }
.issue-subline { font-size:12px; color:var(--muted); margin-top:5px }
.severity-label { display:inline-flex; border:1px solid var(--line); border-radius:20px; padding:0 7px; font-size:11px; line-height:20px; font-weight:500; white-space:nowrap }
.severity-critical { color:#a40e26; background:#ffebe9; border-color:#ffcecb }
.severity-major { color:#6e5200; background:#fff8c5; border-color:#e6cf85 }
.severity-moderate { color:#0550ae; background:#ddf4ff; border-color:#b6e3ff }
.severity-minor { color:var(--muted); background:var(--subtle) }
.round-conclusion { background:var(--subtle); border:1px solid var(--line); border-radius:6px; padding:20px; margin-top:28px }
.round-conclusion h3 { font-size:14px; margin-bottom:8px }
.reading-pagination { display:flex; align-items:center; justify-content:space-between; gap:20px; border-top:1px solid var(--line); padding-top:20px; margin-top:30px; font-size:13px }
.plan-context { display:flex; align-items:center; flex-wrap:wrap; gap:12px; padding:0 0 20px; margin-top:-8px; margin-bottom:28px; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted) }
.plan-context>.link-button { margin-left:auto }
.plan-section { padding-bottom:36px; margin-bottom:32px; border-bottom:1px solid var(--line); scroll-margin-top:24px }
.plan-section:last-of-type { margin-bottom:0 }
.plan-section>.section-heading { margin-bottom:20px }
.section-index { color:var(--muted); font:12px var(--mono-font) }
.section-intro { color:var(--muted); margin:-8px 0 20px; line-height:1.75 }
.plan-block+.plan-block { margin-top:24px }
.block-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:9px }
.block-heading h3 { font-size:15px }
.block-heading .ui-button { min-height:24px; padding:0; border:0; background:none; color:var(--accent); font-size:12px; font-weight:400; flex-shrink:0 }
.plan-claims { padding-top:22px; margin-top:24px; border-top:1px solid var(--line) }
.plan-claims>h3 { font-size:14px; margin-bottom:12px }
.plan-claims>div { display:grid; grid-template-columns:55px minmax(0,1fr) auto; align-items:start; gap:12px; padding:12px 0 }
.plan-claims code { color:var(--muted); padding-top:3px; overflow-wrap:anywhere }
.plan-claims .ui-button { font-size:12px; min-height:28px }
.experiment-block { border:1px solid var(--line); border-radius:6px; margin-top:20px; overflow:hidden; scroll-margin-top:24px }
.experiment-block>header { display:flex; align-items:flex-start; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); background:var(--subtle) }
.experiment-block>header h3 { font-size:15px }
.experiment-block>header p { color:var(--muted); font-size:12px; margin-top:4px }
.experiment-block>header>.badge { margin-left:auto; flex-shrink:0 }
.experiment-id { color:var(--muted); padding-top:3px }
.experiment-summary { padding:16px 20px 8px; line-height:1.75 }
.experiment-fields { padding:0 20px 8px }
.experiment-fields>div { display:grid; grid-template-columns:160px minmax(0,1fr); gap:20px; padding:11px 0; border-bottom:1px solid #eaeef2 }
.experiment-fields>div:last-child { border:0 }
.experiment-fields dt { font-size:12px; padding-top:1px }
.experiment-fields dd { line-height:1.75; white-space:pre-line }
.block-footer { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; padding:12px 20px; border-top:1px solid var(--line); font-size:12px }
.block-footer .record-links { margin-top:0 }
.block-footer .ui-button { font-size:12px; min-height:28px }
.target-highlight { outline:2px solid var(--accent); outline-offset:3px }
.paper-section { display:grid; grid-template-columns:30px minmax(0,1fr); gap:14px; padding:24px 0; border-top:1px solid var(--line) }
.paper-section:first-child { padding-top:0; border-top:0 }
.paper-section:last-child { padding-bottom:0 }
.paper-section-number { color:var(--muted); padding-top:3px }
.paper-fields { display:grid; grid-template-columns:120px minmax(0,1fr); gap:10px 20px }
.paper-fields dt { font-size:12px; padding-top:2px }
.paper-fields dd { line-height:1.8; white-space:pre-line }
.experiment-references { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px }
.experiment-references a { color:var(--accent) }
.roadmap-step { display:grid; grid-template-columns:30px minmax(0,1fr); gap:14px; padding:20px 0; border-top:1px solid var(--line) }
.roadmap-step:first-child { padding-top:0; border:0 }
.roadmap-step>span { padding-top:3px }
.roadmap-step p { line-height:1.8 }
.roadmap-fields { display:grid; grid-template-columns:120px minmax(0,1fr); gap:8px 20px; font-size:13px; margin-top:12px }
.next-step { padding:18px 20px; margin-top:24px; background:var(--subtle); border:1px solid var(--line); border-radius:6px }
.next-step h3 { font-size:14px; margin-bottom:8px }
.document-end { display:flex; flex-wrap:wrap; gap:10px; margin-top:24px }
.search-form { display:flex; gap:8px; margin-bottom:16px }
.search-input { width:100%; min-width:0; height:36px; border:1px solid var(--line); border-radius:6px; padding:7px 12px; background:var(--bg) }
.search-input::placeholder { color:var(--muted) }
.list-box,.source-list { border:1px solid var(--line); border-radius:6px; overflow:hidden }
.list-toolbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; background:var(--subtle); padding:12px 16px; border-bottom:1px solid var(--line) }
.state-filters,.filter-controls { display:flex; gap:20px; align-items:center; flex-wrap:wrap }
.state-filter { border:0; padding:0; background:none; display:flex; align-items:center; gap:7px; color:var(--muted); font-size:13px; min-height:28px }
.state-filter[aria-pressed="true"] { color:var(--text); font-weight:600 }
.severity-select { border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--muted); padding:4px 8px; font-size:12px; max-width:160px }
.issue-row { display:grid; grid-template-columns:18px minmax(0,1fr) 18px; gap:12px; padding:17px 16px; border-bottom:1px solid var(--line) }
.issue-row:last-child { border:0 }
.issue-row:hover { background:var(--subtle) }
.issue-row-title { display:flex; flex-wrap:wrap; align-items:baseline; gap:10px }
.issue-status { color:var(--green); font-size:20px; line-height:24px }
.issue-status.resolved { color:#8250df; font-size:17px }
.row-chevron { color:var(--muted); padding-top:3px }
.empty-panel { padding:40px 24px; text-align:center }
.empty-panel h2 { font-size:18px; margin-bottom:10px }
.empty-panel p { color:var(--muted); margin-bottom:20px }
.back-link { display:inline-block; margin-bottom:18px; font-size:13px }
.detail-heading { padding-bottom:22px; border-bottom:1px solid var(--line); margin-bottom:26px }
.detail-heading h1 { font-size:26px; margin-bottom:14px; font-weight:600; letter-spacing:-.4px }
.detail-layout { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:36px }
.comment { border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:18px }
.comment-header { display:flex; align-items:baseline; flex-wrap:wrap; justify-content:space-between; gap:10px; padding:10px 16px; background:var(--subtle); border-bottom:1px solid var(--line); color:var(--muted); font-size:12px }
.comment-header strong { color:var(--text) }
.comment-body { padding:18px 16px }
.comment-body p { white-space:pre-line; line-height:1.8 }
.thread-action { display:flex; flex-wrap:wrap; align-items:center; gap:12px; font-size:12px; margin-top:24px }
.detail-sidebar { font-size:13px; min-width:0 }
.detail-sidebar>section { padding:0 0 18px; margin-bottom:18px; border-bottom:1px solid var(--line) }
.detail-sidebar h2 { font-size:12px; color:var(--muted); margin-bottom:10px }
.detail-sidebar code { display:block; line-height:1.8 }
.detail-sidebar p { line-height:1.75 }
.source-links { display:grid; gap:9px; font-size:12px }
.source-row { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px 18px; border-bottom:1px solid var(--line) }
.source-row:last-child { border:0 }
.source-row p { color:var(--muted); font-size:12px; margin-top:4px }
.source-row>.source-hash { color:var(--muted); flex-shrink:0 }
.workspace-footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:20px 0 30px; border-top:1px solid var(--line); color:var(--muted); font-size:12px }
